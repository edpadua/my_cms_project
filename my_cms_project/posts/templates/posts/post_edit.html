{% extends 'base.html' %} 

{% block title %}Editar: {{ post.title }}{% endblock title %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <a href="{% url 'post_detail' slug=post.slug %}" class="btn btn-outline-secondary btn-sm mb-3">
                ← Cancelar Edição
            </a>
            
            <h1 class="mb-4">Editar Artigo: {{ post.title }}</h1>
            
            <div class="card p-4 shadow-sm">
                <form method="post">
                    {% csrf_token %} 
                    
                    {{ form.as_p }} 
                    
                    <button type="submit" class="btn btn-warning mt-3">
                        Salvar Alterações
                    </button>
                </form>
            </div>
            
        </div>
    </div>
{% endblock content %}
